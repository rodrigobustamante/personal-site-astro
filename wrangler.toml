name = "personal-site-astro"
compatibility_date = "2025-03-12"

# Node.js compatibility
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "dist/client"
binding = "ASSETS"
# Serve /es from es/index.html without redirecting to /es/ (matches Astro trailingSlash: never)
html_handling = "drop-trailing-slash"
# Only the pages that exist in both languages go through the Worker, so the
# edge language redirect (src/edge/language-redirect.ts) can run before the
# static HTML is served. Everything else is served directly as an asset.
run_worker_first = ["/", "/es", "/es/", "/work", "/work/*", "/es/work", "/es/work/*"]

